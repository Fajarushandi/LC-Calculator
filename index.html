<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Tidak Tersedia</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    text-align: center;
    max-width: 480px;
  }
  .icon {
    font-size: 64px;
    margin-bottom: 24px;
    opacity: 0.8;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  p {
    color: #b0b3c1;
    line-height: 1.6;
    margin-bottom: 24px;
    font-size: 15px;
  }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    color: #9aa0b4;
  }
  .btn {
    margin-top: 24px;
    display: inline-block;
    background: #4f5bd5;
    color: #fff;
    text-decoration: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🚧</div>
    <h1>Website Sedang Tidak Tersedia</h1>
    <p>Maaf, halaman ini sedang dalam perbaikan atau tidak dapat diakses saat ini. Silakan coba lagi beberapa saat lagi.</p>
    <span class="badge">Status: Maintenance</span>
    <br>
    <a href="javascript:location.reload()" class="btn">Coba Lagi</a>
  </div>
</body>
</html>
